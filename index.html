<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6ogo's Projects</title>
    <style>
        :root {
            --primary-color: #222f3e;
            --secondary-color: #00cec9;
            --text-color: #ffffff;
            --background-color: #f5f6fa;
            --card-background: #ffffff;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--primary-color);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        nav {
            background-color: var(--secondary-color);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem auto;
            display: inline-block;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }

        .project-card {
            background-color: var(--card-background);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease-in-out;
        }

        .project-card:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .project-card p {
            max-height: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 1rem;
            position: sticky;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>6ogo's GitHub Projects</h1>
        <p>Showcasing my latest projects and contributions.</p>
    </header>

    <div class="container" id="projects"></div>

    <footer>
        <p>&copy; 2024 6ogo. All Rights Reserved.</p>
    </footer>

    <script>
        async function fetchGitHubRepos() {
            try {
                const response = await fetch('https://api.github.com/users/6ogo/repos');
                if (!response.ok) {
                    throw new Error(`GitHub API returned ${response.status}`);
                }
                const repos = await response.json();
                
                const filteredRepos = repos.filter(repo => repo.name !== "6ogo.github.io");
                
                const reposWithCommits = await Promise.all(
                    filteredRepos.map(async repo => {
                        try {
                            const commitsResponse = await fetch(`https://api.github.com/repos/6ogo/${repo.name}/commits?per_page=1`);
                            if (!commitsResponse.ok) throw new Error('Failed to fetch commits');
                            const commits = await commitsResponse.json();
                            const latestCommit = commits[0] || {};
                            
                            return {
                                title: repo.name,
                                lastModified: repo.pushed_at,
                                commitMessage: latestCommit.commit?.message || 'No commit message available',
                                url: repo.html_url
                            };
                        } catch (error) {
                            return {
                                title: repo.name,
                                lastModified: repo.pushed_at,
                                commitMessage: 'Unable to fetch commit message',
                                url: repo.html_url
                            };
                        }
                    })
                );

                reposWithCommits.sort((a, b) => new Date(b.lastModified) - new Date(a.lastModified));
                
                const projectContainer = document.getElementById("projects");
                projectContainer.innerHTML = reposWithCommits.map(repo => `
                    <div class="project-card">
                        <h3>${repo.title}</h3>
                        <p>${repo.commitMessage}</p>
                        <small>Last updated: ${new Date(repo.lastModified).toLocaleDateString()}</small>
                        <br>
                        <a href="${repo.url}" target="_blank">View on GitHub</a>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error fetching GitHub repos:', error);
            }
        }

        fetchGitHubRepos();
    </script>
</body>
</html>
