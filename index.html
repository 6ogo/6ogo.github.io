<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6ogo's Portfolio</title>
    <style>
        :root {
            --primary-color: #2d3436;
            --secondary-color: #0984e3;
            --text-color: #2d3436;
            --background-color: #f5f6fa;
            --card-background: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 0;
            text-align: center;
        }

        nav {
            background-color: var(--secondary-color);
            padding: 1rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.8;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .project-card {
            background-color: var(--card-background);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-card h3 {
            margin-bottom: 1rem;
            color: var(--secondary-color);
        }

        .project-card p {
            margin-bottom: 1rem;
            color: #636e72;
        }

        .project-card a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .project-card a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>6ogo's Portfolio</h1>
        <p>Welcome to my project showcase</p>
    </header>

    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="https://github.com/6ogo" target="_blank">GitHub</a></li>
        </ul>
    </nav>

    <main>
        <section id="projects">
            <h2>My Projects</h2>
            <div class="projects-grid" id="projectsContainer">
                <!-- Projects will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 6ogo. All rights reserved.</p>
    </footer>

    <script>
        // Function to fetch GitHub repos
        async function fetchGitHubRepos() {
            try {
                const response = await fetch('https://api.github.com/users/6ogo/repos');
                const repos = await response.json();
                return repos.map(repo => ({
                    title: repo.name,
                    description: repo.description || 'No description available',
                    url: repo.html_url
                }));
            } catch (error) {
                console.error('Error fetching GitHub repos:', error);
                return [];
            }
        }

        // Function to load projects from the Projects directory
        async function loadProjects() {
            const projectsContainer = document.getElementById('projectsContainer');
            
            try {
                // Fetch both local projects and GitHub repos
                const [localResponse, githubProjects] = await Promise.all([
                    fetch('/Projects/projects.json').then(r => r.json()).catch(() => []),
                    fetchGitHubRepos()
                ]);
                
                const projects = [...localResponse, ...githubProjects];
                
                projects.forEach(project => {
                    const projectCard = createProjectCard(project);
                    projectsContainer.appendChild(projectCard);
                });
            } catch (error) {
                console.error('Error loading projects:', error);
                // Display placeholder projects if projects.json is not found
                displayPlaceholderProjects();
            }
        }

        // Function to create a project card
        function createProjectCard(project) {
            const card = document.createElement('div');
            card.className = 'project-card';
            
            card.innerHTML = `
                <h3>${project.title}</h3>
                <p>${project.description}</p>
                <a href="${project.url}" target="_blank">View Project →</a>
            `;
            
            return card;
        }

        // Function to display placeholder projects
        function displayPlaceholderProjects() {
            const placeholderProjects = [
                {
                    title: 'Example Project',
                    description: 'Create a projects.json file in the Projects folder to display your actual projects.',
                    url: '#'
                }
            ];

            const projectsContainer = document.getElementById('projectsContainer');
            placeholderProjects.forEach(project => {
                const projectCard = createProjectCard(project);
                projectsContainer.appendChild(projectCard);
            });
        }

        // Load projects when the page loads
        window.addEventListener('load', loadProjects);
    </script>
</body>
</html>
